<!--
  Design Kit: Aurora Glass
  This is a reference for the LLM to generate presentation HTML.
  It defines the colour palette, fonts, and component styles.
-->

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
/* ===== Colour Palette ===== */
:root {
    --lime: #bef264;
    --teal: #2dd4bf;
    --cyan: #67e8f9;
    --purple: #7c3aed;
    --text: #0f172a;
    --text-light: #475569;
    --glass: rgba(255, 255, 255, 0.65);
}

/* ===== Base ===== */
html { font-size: 16px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: #ffffff;
    color: var(--text);
    /* HORIZONTAL scroll-snap container */
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    height: 100vh;
    width: 100vw;
}

/* ===== Slide (each slide = full viewport) ===== */
.slide {
    flex: 0 0 100vw;
    height: 100vh;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background: #ffffff;
}

/* ===== Aurora Background (animated blurred blobs) ===== */
.slide .aurora {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}
.aurora-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    animation: float 10s ease-in-out infinite;
}
.blob1 { width: 600px; height: 600px; background: var(--lime); top: -200px; left: -150px; animation-delay: 0s; }
.blob2 { width: 500px; height: 500px; background: var(--teal); bottom: -150px; right: -100px; animation-delay: -3s; }
.blob3 { width: 400px; height: 400px; background: var(--purple); opacity: 0.2; top: 30%; left: 40%; animation-delay: -6s; }
.blob4 { width: 350px; height: 350px; background: var(--cyan); bottom: 10%; left: 20%; animation-delay: -2s; }
@keyframes float {
    0%, 100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(30px, -30px) scale(1.05); }
    66% { transform: translate(-20px, 20px) scale(0.97); }
}

/* ===== Glass Panel ===== */
.glass-panel {
    position: relative;
    z-index: 1;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 1.5rem;
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 24px 80px rgba(15,23,42,0.12), 0 2px 0 rgba(255,255,255,0.9) inset;
    padding: 3rem 4rem;
    max-width: 900px;
    width: 85%;
}

/* ===== Slide Number ===== */
.slide-number {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-light);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
}
.slide-number::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(15,23,42,0.08);
}

/* ===== Slide Title ===== */
.slide-title {
    font-weight: 800;
    font-size: clamp(1.8rem, 3.5vw, 2.8rem);
    line-height: 1.15;
    margin-bottom: 1.5rem;
    color: var(--text);
}

/* ===== Slide Text ===== */
.slide-text {
    font-weight: 400;
    font-size: 1.1rem;
    line-height: 1.8;
    color: var(--text-light);
    margin-bottom: 2rem;
}

/* ===== Visual Description ===== */
.slide-visual {
    background: rgba(255,255,255,0.75);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 1rem;
    padding: 1.25rem 1.5rem;
    box-shadow: 0 4px 20px rgba(15,23,42,0.06);
}
.slide-visual-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--purple);
    margin-bottom: 0.5rem;
    font-weight: 700;
}
.slide-visual-text {
    font-size: 0.9rem;
    color: var(--text-light);
    line-height: 1.5;
    font-style: italic;
}

/* ===== Title Slide ===== */
.title-slide .glass-panel {
    text-align: center;
    padding: 4rem 5rem;
}
.title-slide .slide-title {
    font-size: clamp(2.4rem, 4.5vw, 3.6rem);
    background: linear-gradient(135deg, #15803d, #65a30d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.title-slide .slide-subtitle {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    color: var(--text-light);
    margin-top: 1rem;
}

/* ===== Progress Bar ===== */
.slide-progress {
    position: absolute;
    top: 0;
    left: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--lime), var(--teal));
    border-radius: 0 2px 2px 0;
    z-index: 2;
}

/* ===== Print Styles ===== */
@media print {
    body { display: block; overflow: visible; }
    .slide {
        page-break-after: always;
        height: 100vh;
        min-height: 100vh;
    }
    .aurora-blob { animation: none !important; }
    .slide-progress { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
