services:
  postgres:
    image: postgres:16-alpine
    container_name: prezi_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-prezi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  service:
    build:
      context: ./service
    container_name: prezi_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: ./bot
    container_name: prezi_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://service:8000
    depends_on:
      - service

volumes:
  postgres_data:
